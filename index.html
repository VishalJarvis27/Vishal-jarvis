
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vishal Jarvis</title>
<style>
body {
  background:#050b16;
  color:#00eaff;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:25px;
}
h1 { margin-top:35px; }
.circle {
  width:180px;
  height:180px;
  border:3px solid #00eaff;
  border-radius:50%;
  margin:35px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  box-shadow:0 0 25px #00eaff;
}
button {
  background:#00eaff;
  color:#001018;
  border:0;
  border-radius:12px;
  padding:15px 25px;
  font-size:17px;
  margin:8px;
}
#reply {
  color:white;
  margin:25px auto;
  line-height:1.6;
}
</style>
</head>
<body>
<h1>VISHAL JARVIS</h1>
<p>आपका व्यक्तिगत AI सहायक</p>

<div class="circle">🤖</div>

<button onclick="startJarvis()">🎤 Hey Jarvis</button>
<button onclick="stopJarvis()">बंद करें</button>

<div id="reply">नमस्ते! मैं आपका Jarvis हूँ।</div>

<script>
const reply = document.getElementById("reply");
let recognition;

function speak(text) {
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "hi-IN";
  msg.rate = 0.9;
  speechSynthesis.speak(msg);
  reply.innerText = text;
}

function startJarvis() {
  const SR = window.SpeechRecognition ||
             window.webkitSpeechRecognition;

  if (!SR) {
    speak("आपके ब्राउज़र में वॉइस रिकग्निशन उपलब्ध नहीं है।");
    return;
  }

  recognition = new SR();
  recognition.lang = "hi-IN";
  recognition.onresult = function(event) {
    const command = event.results[0][0].transcript.toLowerCase();
    reply.innerText = "आपने कहा: " + command;

    if (command.includes("जार्विस") ||
        command.includes("jarvis")) {
      speak("जी, बताइए। मैं आपकी क्या मदद कर सकता हूँ?");
    } else if (command.includes("समय")) {
      speak("समय जानने के लिए अपने फोन की घड़ी देखें।");
    } else if (command.includes("नमस्ते")) {
      speak("नमस्ते! आप कैसे हैं?");
    } else {
      speak("मैंने आपकी बात सुनी। यह मेरा शुरुआती वर्जन है।");
    }
  };

  recognition.onerror = function() {
    reply.innerText = "माइक्रोफोन की अनुमति दें और दोबारा कोशिश करें।";
  };

  recognition.start();
}

function stopJarvis() {
  if (recognition) recognition.stop();
  speechSynthesis.cancel();
  reply.innerText = "Jarvis बंद है।";
}
</script>
</body>
</html>
